<!doctype html><html lang="ja"><head><meta charset="UTF-8"><title>OTTSub · 日本語のスクリーンショット</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0d11;color:#f7f7fa;font-family:"Segoe UI",Arial,sans-serif;width:1280px;height:800px;overflow:hidden}
.canvas{position:relative;width:1280px;height:800px;background:radial-gradient(ellipse at 88% 16%,#31151c 0,transparent 52%),#0d0d11;padding:48px}
.brand{display:flex;align-items:center;gap:14px;font-size:29px;font-weight:800;letter-spacing:-1px}.brand img{width:38px;height:38px}
.eyebrow{color:#ff6068;font-size:13px;letter-spacing:2.3px;font-weight:700;margin:55px 0 20px}
h1{font-size:61px;line-height:1.08;letter-spacing:-2px;margin:0 0 25px;font-weight:750}.description{font-size:20px;line-height:1.65;color:#bcbec8;margin:0;max-width:600px}
.left{width:640px}.detail{margin-top:35px;width:620px}.demo-screen{border:1px solid #39333d;border-radius:16px;height:194px;background:linear-gradient(145deg,#26393e,#1b202c 55%,#2b1b24);padding:25px 26px;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.demo-label{position:absolute;top:17px;left:20px;color:#b3bac2;font-size:11px;letter-spacing:1.3px}.line1,.line2{font-weight:650;text-align:center;line-height:1.5;text-shadow:0 2px 5px #000}.line1{font-size:27px}.line2{font-size:22px;color:#ffe082}.hint{color:#8d919f;font-size:12px;line-height:1.6;margin-top:12px}
.keyrow{display:flex;gap:16px}.keycard{padding:23px;border-radius:12px;background:#202027;border:1px solid #3a3843;flex:1}.keys{font-family:Consolas,monospace;font-size:29px;letter-spacing:1px}.keylabel{font-size:15px;color:#bcbec8;line-height:1.6;margin-top:12px}.accent{color:#ff6e76}
.steps{display:flex;gap:18px;margin-top:28px}.step{display:flex;align-items:center;gap:10px;color:#c8c9d2;font-size:16px}.num{font-size:13px;background:#302127;color:#ff969c;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.panel{position:absolute;left:752px;top:50px;width:480px;height:684px;border:1px solid #454048;border-radius:16px;overflow:hidden;background:#141414;box-shadow:0 20px 60px #0005}.panel-bar{height:34px;background:#242126;border-bottom:1px solid #38343d;display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:#bcbbc5;font-size:11px;letter-spacing:.6px}.panel-bar span:last-child{font-size:16px;color:#77727f}
iframe{width:100%;height:649px;border:0;display:block}.footer{position:absolute;left:48px;right:48px;bottom:27px;border-top:1px solid #2e2b34;padding-top:16px;display:flex;justify-content:space-between;font-size:11px;color:#9293a1}.footer span:first-child{max-width:1050px}
body{font-family:"Yu Gothic","Meiryo","Segoe UI",sans-serif}h1{font-size:54px;line-height:1.25;letter-spacing:-1px}.eyebrow{letter-spacing:1px}.demo-label{letter-spacing:1px}.line1{font-family:"Segoe UI",Arial,sans-serif}.keys{font-size:26px}</style></head><body><main class="canvas"><div class="left"><div class="brand"><img src="/icons/icon48.png" alt="">OTTSub</div><div class="eyebrow" id="eyebrow"></div><h1 id="headline"></h1><p class="description" id="description"></p><div class="detail" id="detail"></div></div><aside class="panel"><div class="panel-bar"><span>サイドパネル · OTTSubの設定</span><span>⋮</span></div><iframe title="OTTSubの日本語設定画面" id="panel"></iframe></aside><footer class="footer"><span>Netflix用 · 利用できる言語は作品によって異なります。画面と字幕はデモデータです。</span><span id="number"></span></footer></main>
<script>
const n=Math.min(3,Math.max(1,Number(new URLSearchParams(location.search).get('slide')||1)));
const slides=[{"eyebrow":"01 / 二言語字幕","headline":"2つの言語を、<br>ひと目で。","description":"利用できる字幕から2つの言語を選択。<br>サイドパネルでそれぞれ設定できます。","detail":"<div class=\"demo-screen\"><div class=\"demo-label\">字幕の表示例</div><div class=\"line1\">Let’s take the long way home.</div><div class=\"line2\">遠回りして帰ろう。</div></div><p class=\"hint\">英語 ＋ 日本語 · 言語ごとに設定可能</p>"},{"eyebrow":"02 / 字幕の同期","headline":"字幕のタイミングを<br>思いどおりに。","description":"言語ごとに字幕のタイミングを調整。<br>0.1秒単位で細かく合わせられます。","detail":"<div class=\"keyrow\"><div class=\"keycard\"><div class=\"keys\">[ &nbsp; ]</div><div class=\"keylabel\">主字幕<br><span class=\"accent\">−0.1秒 / +0.1秒</span></div></div><div class=\"keycard\"><div class=\"keys\">Alt + [ / ]</div><div class=\"keylabel\">副字幕<br><span class=\"accent\">−0.1秒 / +0.1秒</span></div></div></div><p class=\"hint\">サイドパネルのスライダーでも調整できます。</p>"},{"eyebrow":"03 / 語学学習","headline":"字幕で学ぶ。<br>一行ずつ。","description":"訳文をぼかして、理解力を試す。<br>字幕にマウスを重ねると一時停止できます。","detail":"<div class=\"demo-screen\"><div class=\"demo-label\">学習の表示例</div><div class=\"line1\">One more step. You’re almost there.</div><div class=\"line2\" style=\"filter:blur(5px)\">あと一歩。もうすぐだよ。</div></div><div class=\"steps\"><div class=\"step\"><span class=\"num\">1</span>読む</div><div class=\"step\"><span class=\"num\">2</span>確認する</div><div class=\"step\"><span class=\"num\">3</span>続きを見る</div></div>"}];const s=slides[n-1];for(const key of ['eyebrow','headline','description','detail'])document.getElementById(key).innerHTML=s[key];document.getElementById('number').textContent=`0${n} / 03`;document.getElementById('panel').src=`/panel.html?slide=${n}`;
</script></body></html>
