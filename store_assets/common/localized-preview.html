<!doctype html><html lang="{{LANG}}" dir="{{DIR}}"><head><meta charset="UTF-8"><title>OTTSub</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0d11;color:#f7f7fa;font-family:"Segoe UI",Arial,sans-serif;width:1280px;height:800px;overflow:hidden}
.canvas{position:relative;width:1280px;height:800px;background:radial-gradient(ellipse at 88% 16%,#31151c 0,transparent 52%),#0d0d11;padding:48px}
.brand{display:flex;align-items:center;gap:14px;font-size:29px;font-weight:800;letter-spacing:-1px}.brand img{width:38px;height:38px}
.eyebrow{color:#ff6068;font-size:13px;letter-spacing:1.6px;font-weight:700;margin:51px 0 20px}
h1{font-size:56px;line-height:1.12;letter-spacing:-1.6px;margin:0 0 25px;font-weight:750}.description{font-size:19px;line-height:1.65;color:#bcbec8;margin:0;max-width:620px}
.left{width:640px}.detail{margin-top:32px;width:620px}.demo-screen{border:1px solid #39333d;border-radius:16px;height:194px;background:linear-gradient(145deg,#26393e,#1b202c 55%,#2b1b24);padding:25px 26px;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.demo-label{position:absolute;top:17px;inset-inline-start:20px;color:#b3bac2;font-size:11px;letter-spacing:1px}.line1,.line2{font-weight:650;text-align:center;line-height:1.5;text-shadow:0 2px 5px #000}.line1{font-size:27px}.line2{font-size:22px;color:#ffe082}.hint{color:#a3a6b2;font-size:13px;line-height:1.6;margin-top:12px}
.keyrow{display:flex;gap:16px}.keycard{padding:23px;border-radius:12px;background:#202027;border:1px solid #3a3843;flex:1;min-width:0}.keys{font-family:Consolas,monospace;font-size:28px;letter-spacing:1px;direction:ltr;unicode-bidi:isolate}.keylabel{font-size:16px;color:#bcbec8;line-height:1.6;margin-top:12px}.accent{color:#ff6e76;display:inline-block;direction:ltr;unicode-bidi:isolate}
.steps{display:flex;gap:18px;margin-top:25px}.step{display:flex;align-items:center;gap:10px;color:#c8c9d2;font-size:16px}.num{font-size:13px;background:#302127;color:#ff969c;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.panel{position:absolute;left:752px;top:38px;width:480px;height:696px;border:1px solid #454048;border-radius:16px;overflow:hidden;background:#141414;box-shadow:0 20px 60px #0005}.panel-bar{height:34px;background:#242126;border-bottom:1px solid #38343d;display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:#bcbbc5;font-size:11px}.panel-bar span:last-child{font-size:16px;color:#77727f}
iframe{width:100%;height:661px;border:0;display:block}.footer{position:absolute;left:48px;right:48px;bottom:27px;border-top:1px solid #2e2b34;padding-top:16px;display:flex;justify-content:space-between;gap:22px;font-size:11px;color:#a4a5b0}.footer span:first-child{max-width:1050px}#number{direction:ltr;unicode-bidi:isolate;white-space:nowrap}
html[dir=rtl] .left{margin-left:auto}html[dir=rtl] .panel{left:48px}html[dir=rtl] .brand{direction:ltr;justify-content:flex-end}html[dir=rtl] .eyebrow{letter-spacing:0;font-size:16px}html[dir=rtl] h1{letter-spacing:0;line-height:1.2}html[dir=rtl] .description{font-size:22px}html[dir=rtl] .demo-label{letter-spacing:0;font-size:13px}html[dir=rtl] .keylabel{font-size:18px}html[dir=rtl] .hint{font-size:14px}html[dir=rtl] .footer{font-size:12px}
html:lang(th) h1{letter-spacing:0;line-height:1.28}html:lang(th) .eyebrow,html:lang(th) .demo-label{letter-spacing:0}html:lang(th) .footer{line-height:1.5}
</style></head><body><main class="canvas"><div class="left"><div class="brand"><img src="/icons/icon48.png" alt="">OTTSub</div><div class="eyebrow" id="eyebrow"></div><h1 id="headline"></h1><p class="description" id="description"></p><div class="detail" id="detail"></div></div><aside class="panel"><div class="panel-bar"><span id="panel-label"></span><span>⋮</span></div><iframe id="panel"></iframe></aside><footer class="footer"><span id="footer-copy"></span><span id="number"></span></footer></main>
<script>
(async()=>{const data=await(await fetch('/slides.json')).json();const n=Math.min(3,Math.max(1,Number(new URLSearchParams(location.search).get('slide')||1)));const slide=data.slides[n-1];document.title=data.title;for(const key of ['eyebrow','headline','description','detail'])document.getElementById(key).innerHTML=slide[key];document.getElementById('panel-label').textContent=data.panelLabel;document.getElementById('footer-copy').textContent=data.footer;document.getElementById('number').textContent=`0${n} / 03`;document.getElementById('panel').title=data.panelTitle;document.getElementById('panel').src=`/panel.html?slide=${n}`;window.previewReady=true;})();
</script></body></html>
